# Docker Skill Configuration
# Customize behavior without changing the core workflow.

[skill]
name = "bmad-docker"
version = "1.0.0"
description = "Docker containerization: Dockerfile, Compose, BuildKit, security, validation"

# Validation settings
[validation]
hadolint_rules = "all"
cache_ttl_hours = 336  # 14 days
strict_mode = false

# DocSync settings
[docsync]
enabled = true
fetch_on_demand = true
cache_dir = "_bmad/cache/docker-docs"
endpoints = [
  "https://docs.docker.com/engine/reference/builder/",
  "https://docs.docker.com/reference/compose-file/",
  "https://docs.docker.com/build/building/best-practices/",
]

# Template defaults
[templates]
default_base_node = "node:22-alpine"
default_base_python = "python:3.12-slim"
default_base_go = "golang:1.23-alpine"
default_base_rust = "rust:1.82-slim"
default_non_root_user = "appuser"
default_workdir = "/app"
