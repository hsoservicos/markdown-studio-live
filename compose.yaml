services:
  markdown-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-studio:local
    container_name: markdown-studio
    ports:
      - '5001:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
