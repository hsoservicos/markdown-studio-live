services:
  markdown-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-studio:local
    container_name: markdown-studio
    ports:
      - '${PORT:-5001}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: true
    # mode=1777 e obrigatorio: sem ele o tmpfs nasce root-owned e o nginx
    # (USER app, uid 1001) nao consegue criar /var/cache/nginx/client_temp ->
    # crash-loop "mkdir() failed (13: Permission denied)".
    tmpfs:
      - /var/cache/nginx:rw,mode=1777
      - /var/run:rw,mode=1777
