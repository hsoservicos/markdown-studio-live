code = "DF"
description = "Criar ou refatorar Dockerfile otimizado"
skill = "bmad-docker"

[[agent.menu]]
code = "DC"
description = "Criar ou refatorar docker-compose.yml (Compose Specification)"
skill = "bmad-docker"

[[agent.menu]]
code = "VL"
description = "Validar Dockerfile ou Compose existente com regras hadolint-like"
skill = "bmad-docker"

[[agent.menu]]
code = "DS"
description = "DocSync — verificar atualizações e deprecations na doc oficial do Docker"
skill = "bmad-docker"

