server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache index.html como HTML (sem revalidação agressiva de assets).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy no-referrer;
    }

    # Assets hasheados pelo Vite: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Não expor arquivos sensíveis caso cheguem ao dist.
    location ~ /\.(?!well-known) {
        deny all;
    }
}