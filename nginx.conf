server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── ATENÇÃO: regra de herança do nginx ──────────────────────────────────
    # Um `add_header` declarado DENTRO de um `location` CANCELA a herança de
    # TODOS os `add_header` do nível server. Por isso este bloco aparece
    # duplicado em `location /` abaixo — as duas cópias precisam ser idênticas
    # (travado por tests/unit/csp.test.js, teste "as cópias da CSP são idênticas").
    #
    # O contrário também vale e é o que protege `/assets/` e as imagens:
    # `expires` NÃO é `add_header`, logo esses locations não declararem
    # nenhum `add_header` e HERDAM este bloco inteiro. Nunca adicione
    # `add_header Cache-Control` em `/assets/` ou na regex de imagens —
    # é exatamente o bug que deixou os assets sem CSP/nosniff/HSTS.

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # "0" (e não "1; mode=block"): a diretiva é obsoleta e o modo block foi
    # removido dos navegadores modernos — a recomendação atual é desligá-la.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # F2: endurecimento extra — sem APIs de dispositivo, sem cooperação de
    # janela entre origens e recursos só servidos para a mesma origem.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS: fixa HTTPS por 1 ano, só neste host e seus subdomínios.
    #   Sem 'preload' de propósito — a lista de preload é difícil de reverter.
    #   Browsers ignoram o header em HTTP, então não quebra quem chega por lá.
    #   A origem responde por HTTP atrás do tunnel cloudflared e o TLS na borda
    #   é do Cloudflare: o FQDN do Coolify fica em http:// (trocar para https://
    #   faria o traefik exigir TLS e derrubaria o ingress do tunnel).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP
    #   script-src sem 'unsafe-inline'/'unsafe-eval':
    #     - O único script inline é o boot de tema (anti-FOUC) do index.html;
    #       ele é autorizado por hash sha256, travado por tests/unit/csp.test.js
    #       (se o inline script mudar, o teste falha e o hash é atualizado aqui).
    #     - Os demais scripts são módulos same-origin emitidos pelo Vite ('self').
    #     - 'unsafe-eval' saiu: o bundle de produção não chama eval/new Function
    #       (Monaco via ESM dispensa o loader AMD). Os fallbacks legados
    #       `Function('return this')` de polyfills (core-js/lodash/function-bind)
    #       nunca executam em navegadores modernos: estão guardados por globalThis
    #       ou só rodam quando Function.prototype.bind é ausente.
    #     - 'strict-dynamic' NÃO se aplica: sem nonce por request (HTML estático) ele
    #       ignora 'self' e bloquearia o módulo de entrada inserido pelo parser.
    #   style-src 'unsafe-inline' permanece: Monaco/KaTeX/Mermaid injetam <style>
    #   e atributos style em tempo de execução.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-E0zyznwTfBN5coOE9DNftTbtxLb8xNk6Dpp9H/c7fKQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;

    # Anti-injeção do Cloudflare
    #   O Cloudflare injeta o JavaScript Detections (JSD) como <script> inline no fim
    #   do HTML — com hash dinâmico por request, impossível de autorizar no script-src
    #   acima, e portanto violador da CSP em todo carregamento de página.
    #   A doc do Cloudflare (javascript-detections) determina: quando a resposta da
    #   origin traz `Cache-Control: no-transform`, o script NÃO é injetado.
    #   Ganho: CSP estrita sem erros de console. Custo: o Cloudflare deixa de
    #   transformar/minificar o HTML (o gzip do próprio nginx já cobre compressão).
    #   Travado por tests/unit/csp.test.js.
    #
    #   Declarado só em `location /` e NÃO aqui: no nível server ele seria herdado
    #   pelos assets, que já ganham Cache-Control do `expires` — resposta com DOIS
    #   Cache-Control conflitantes. Só o HTML precisa dele: o JSD é injetado apenas
    #   em documentos.

    # SPA fallback + shell do app.
    #
    #   Este location DECLARA `add_header`, portanto repete o bloco de segurança
    #   acima (ver "regra de herança" no topo).
    #
    #   `no-store` em `no-transform`: sem no-store o HTML sai só com Last-Modified
    #   e o browser aplica cache heurístico — após um deploy o cliente com HTML
    #   velho pede `assets/index-<hash>.js` já deletado e a página fica em branco.
    #   `no-transform` precisa permanecer junto: é o que suspende a injeção do
    #   JavaScript Detections do Cloudflare.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-E0zyznwTfBN5coOE9DNftTbtxLb8xNk6Dpp9H/c7fKQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;
        add_header Cache-Control "no-store, no-transform" always;
    }

    # Assets hasheados pelo Vite: cache longo.
    #
    #   Só `expires` — NENHUM `add_header` aqui, de propósito. Assim este
    #   location herda o bloco de segurança do nível server (CSP, nosniff, XFO,
    #   Referrer-Policy, HSTS) e emite um único Cache-Control.
    #   Não trocar por `expires` + `add_header Cache-Control`: duplicaria o
    #   cabeçalho E apagaria os headers de segurança.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # CSS do app: fora de /assets/ (não é hasheado) e fora da regex de imagens —
    # caía no `no-store` do `location /` e era rebaixado a cada load. Mesma
    # lógica de herança: só `expires`, nenhum `add_header` (F1).
    location /css/ {
        try_files $uri =404;
        expires 30d;
    }

    # Fontes e recursos estáticos — mesma lógica de herança acima.
    location ~* \.(ttf|woff|woff2|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
    }

    # Negar arquivos sensíveis (sem add_header → herda o bloco de segurança)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Negar arquivos de backup e temporários
    location ~* \.(bak|orig|save|swp|tmp)$ {
        deny all;
    }

    # Desabilitar server signature
    server_tokens off;
}
