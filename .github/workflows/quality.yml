name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gatilho manual por branch. ATENÇÃO: o run criado aqui NÃO entra no rollup do
  # pull request — a proteção de `main` só conta o check do evento `pull_request`.
  # Quem destrava o release é o step "Approve pull request runs" do release.yml,
  # que aprova esse run via API (sem isso ele nasce em `action_required` e nunca
  # roda, e o auto-merge fica BLOCKED até estourar o timeout).
  workflow_dispatch:

# Least privilege: o job só lê o repositório e publica coverage/artefato de build.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
