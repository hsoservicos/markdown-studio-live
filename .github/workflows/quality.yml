name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gatilho manual por branch. ATENÇÃO: o run criado aqui NÃO entra no rollup do
  # pull request — a proteção de `main` só conta o check do evento `pull_request`.
  # Quem destrava o release é o step "Approve pull request runs" do release.yml,
  # que aprova esse run via API (sem isso ele nasce em `action_required` e nunca
  # roda, e o auto-merge fica BLOCKED até estourar o timeout).
  workflow_dispatch:

# Least privilege: o job só lê o repositório e publica coverage/artefato de build.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `.nvmrc` é a fonte única da versão (idem engines/.nvmrc no AGENTS):
          # hardcodar `22` aqui deixava CI e `nvm use` divergirem após um bump.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Gate único — a mesma sequência do script `quality` do package.json.
      # Repetir os seis passos um a um aqui duplicava o gate: qualquer checagem
      # nova adicionada a `quality` entraria na release sem passar pelo CI.
      - name: Quality gate
        run: npm run quality
