name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Exceção documentada à anti-recursão do GitHub: eventos causados por
  # GITHUB_TOKEN (push, pull_request) não disparam workflows, mas
  # workflow_dispatch dispara. É o que faz o check `quality` aparecer no
  # PR aberto pelo release, sem ele o auto-merge nunca dispara.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:md
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
