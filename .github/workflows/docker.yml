name: Docker Build

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'compose.yaml'
      - 'compose.dev.yaml'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: markdown-studio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Test image health
        run: |
          docker run -d --name test-container -p 5001:80 markdown-studio:test
          sleep 10
          curl -f http://localhost:5001/ || exit 1
          docker stop test-container
          docker rm test-container

      - name: Log in to GHCR (main branch only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main branch only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BUILD_DATE=${{ github.event.head_commit.timestamp }}
