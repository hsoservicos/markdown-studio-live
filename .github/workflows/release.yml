name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  pull-requests: write

# `main` exige pull request e o check `quality`. O GITHUB_TOKEN não pode
# empurrar direto (GH006), e o bypass de proteção só existe em repositórios
# de organização — então o bump viaja numa branch de release, abre PR e
# aguarda o auto-merge disparar sozinho quando a CI aprovar.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm run release:${{ inputs.bump }}

      - name: Get new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "branch=release/v$VERSION" >> $GITHUB_OUTPUT

      # Um release que morreu no meio (ex.: permissão de criar PR) deixa a branch
      # para trás, e o push seguinte sai como non-fast-forward. A branch é
      # descartável — sempre começa limpa. `main` segue protegido contra force-push.
      - name: Push release branch
        run: |
          BRANCH="${{ steps.version.outputs.branch }}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${{ steps.version.outputs.branch }}" \
            --title "chore: release v${{ steps.version.outputs.version }}" \
            --body "Release automatizado de \`v${{ steps.version.outputs.version }}\` (bump ${{ inputs.bump }}) gerado pelo workflow \`Release\`."
          PR=$(gh pr list --head "${{ steps.version.outputs.branch }}" --base "${GITHUB_REF_NAME}" --json number --jq '.[0].number')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "PR #$PR aberto"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pr }}" --squash --auto --delete-branch

      - name: Wait for merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr.outputs.pr }}"
          for i in $(seq 1 90); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            echo "attempt $i: state=$STATE"
            if [ "$STATE" = "MERGED" ]; then exit 0; fi
            if [ "$STATE" = "CLOSED" ]; then echo "PR fechado sem merge"; exit 1; fi
            sleep 10
          done
          echo "timeout esperando o auto-merge"; exit 1

      # O commit que sobrevive é o squash-merge em `main`, não o commit local do
      # bump — a tag precisa apontar para o SHA que de fato entrou na branch.
      - name: Tag merged commit
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git tag -d "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          git tag "${{ steps.version.outputs.tag }}" "origin/${GITHUB_REF_NAME}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build
        run: npm run build

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
